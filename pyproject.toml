[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "callables"
dynamic = ["version"]
description = "Decorate Python functions and push them to Callables: forms, schedules and run history for your team."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://callables.app"
Source = "https://github.com/callables-app/callables-python"

[project.scripts]
call = "callables.cli:main"
callables = "callables.cli:main"
shipfn = "callables.cli:main"  # the old name, kept for existing scripts

[tool.setuptools.packages.find]
include = ["callables*", "shipfn*"]

[tool.setuptools.package-data]
callables = ["py.typed", "GUIDE.md"]

[tool.setuptools.dynamic]
version = { attr = "callables.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
